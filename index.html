<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5b1a20">
<title>俄罗斯史诗 · HISTORY OF RUSSIA</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 顶部栏 -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="目录">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="topbar-title" id="topTitle">俄罗斯史诗</div>
    <button class="icon-btn" id="btnSearch" aria-label="搜索">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
    </button>
  </header>

  <!-- 主体视图容器 -->
  <main id="view" class="view"></main>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>书架</span></button>
    <button class="tab" data-tab="contents"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg><span>目录</span></button>
    <button class="tab" data-tab="archives"><svg viewBox="0 0 24 24"><path d="M3 7h18v14H3zM2 4h20v3H2zM9 11h6"/></svg><span>档案</span></button>
    <button class="tab" data-tab="mine"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg><span>我的</span></button>
  </nav>

  <!-- 抽屉目录 -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <div class="drawer-kicker">HISTORY OF RUSSIA</div>
        <div class="drawer-title">历史目录</div>
      </div>
      <button class="icon-btn" id="btnCloseDrawer" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-search"><input id="drawerFilter" placeholder="筛选时代或章节…" autocomplete="off"></div>
    <div class="drawer-list" id="drawerList"></div>
  </aside>

  <!-- 搜索面板 -->
  <div class="sheet-backdrop" id="searchBackdrop"></div>
  <div class="search-sheet" id="searchSheet">
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
      <input id="searchInput" placeholder="搜索人物、事件、制度、概念…" autocomplete="off">
      <button id="btnCloseSearch">取消</button>
    </div>
    <div class="search-meta" id="searchMeta"></div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- 笔记弹窗 -->
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="note-modal" id="noteModal">
    <div class="note-head"><span id="noteChapterTitle">阅读笔记</span><button id="btnCloseNote">✕</button></div>
    <textarea id="noteText" placeholder="写下你的想法、疑问或摘录…"></textarea>
    <div class="note-actions"><button class="btn-ghost" id="btnDeleteNote">删除</button><button class="btn-primary" id="btnSaveNote">保存笔记</button></div>
  </div>

  <!-- 阅读工具条 -->
  <div class="read-toolbar" id="readToolbar">
    <button id="btnBookmark" title="书签"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    <button id="btnNote" title="笔记"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/></svg></button>
    <button id="btnPrev" title="上一章"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="read-progress" id="readProgress">1 / 1</span>
    <button id="btnNext" title="下一章"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script src="data/core.js"></script>
<script src="data/vol1.js"></script>
<script src="data/vol2.js"></script>
<script src="data/vol3.js"></script>
<script src="data/vol4.js"></script>
<script src="data/vol5.js"></script>
<script src="data/extra1.js"></script>
<script src="data/extra2.js"></script>
<script src="data/extra3.js"></script>
<script src="data/extra4.js"></script>
<script src="data/extra5.js"></script>
<script src="data/extra6.js"></script>
<script src="data/extra7.js"></script>
<script src="data/extra8.js"></script>
<script src="data/deep1.js"></script>
<script src="data/deep2.js"></script>
<script src="data/deep3.js"></script>
<script src="app.js"></script>
</body>
</html>
